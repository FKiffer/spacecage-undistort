[project]
name = "spacecage-undistort"
version = "0.1.1"
description = "NASA SpaceCage video undistortion tool for fisheye camera calibration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "pyyaml>=5.4.0",
    "scikit-image>=0.18.0",
    "shapely>=2.0.0",
    "sleap-io>=0.5.0",
    "tqdm>=4.60.0",
    "imageio>=2.9.0",
]
authors = [
    {name = "Talmo Lab"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
spacecage-undistort = "spacecage_undistort.cli:main"
spacecage-transform-coords = "spacecage_undistort.cli:main_coordinates"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacecage_undistort"]
